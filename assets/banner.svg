<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="readmeforge: Generate a polished README and an animated SVG banner in one command.">
  <title>readmeforge: Generate a polished README and an animated SVG banner in one command.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#151b2b"/></linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a371f7"/><stop offset="1" stop-color="#f778ba"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#30363d"/></pattern>
  </defs>
  <style>
    .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .orb1 { animation: float1 7s ease-in-out infinite; } .orb2 { animation: float2 9s ease-in-out infinite; }
    .orb3 { animation: float1 11s ease-in-out infinite reverse; }
    .sweep { stroke-dasharray: 220 680; animation: sweep 3.2s linear infinite; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .title { opacity: 0; animation: rise .8s ease-out .1s forwards; }
    .tag { opacity: 0; animation: rise .8s ease-out .4s forwards; }
    .fade { opacity: 0; animation: rise .6s ease-out forwards; }
    @keyframes float1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(24px,-18px); } }
    @keyframes float2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-30px,16px); } }
    @keyframes sweep { to { stroke-dashoffset: -900; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  </style>
  <rect width="900" height="240" rx="18" fill="url(#bg)"/>
  <rect width="900" height="240" rx="18" fill="url(#dots)"/>
  <circle class="orb1" cx="760" cy="60" r="70" fill="#a371f7" opacity=".16"/>
  <circle class="orb2" cx="840" cy="190" r="48" fill="#f778ba" opacity=".18"/>
  <circle class="orb3" cx="660" cy="170" r="30" fill="#a371f7" opacity=".12"/>
  <rect x=".5" y=".5" width="899" height="239" rx="17.5" fill="none" stroke="#30363d"/>
  <text class="sans title" x="60" y="104" font-size="64" font-weight="800" fill="url(#ac)">readmeforge</text>
  <path class="sweep" d="M62 122 H838" stroke="url(#ac)" stroke-width="3" stroke-linecap="round" fill="none"/>
  <text class="sans tag" x="62" y="158" font-size="20" fill="#8b949e">Generate a polished README and an animated SVG banner in one command.</text>
  <rect class="cursor" x="821" y="141" width="10" height="20" fill="#f778ba"/>
  <g class="sans" font-size="13" font-weight="600"><g class="fade" style="animation-delay:0.8s"><rect x="62" y="176" width="73" height="28" rx="14" fill="#1f2a37" stroke="#2d3b4b"/><text x="98.5" y="195" text-anchor="middle" fill="#f778ba">Python</text></g></g>
</svg>
